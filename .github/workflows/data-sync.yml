name: Scheduled Golf Data Check

on:
  schedule:
    # 매주 월요일 KST 04:00 (UTC 일요일 19:00) 정기 자동 실행
    - cron: '0 19 * * 0'
  workflow_dispatch: # 관리자가 원할 때 수동 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data check (KGA change detection + validation)
        run: |
          python scripts/pipeline/sync_golf_data.py

      - name: Setup Node.js & Build Test
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Verify build with updated data
        run: npm run build

      - name: Upload changed KGA rating PDF (for manual review)
        if: hashFiles('AllRatings_latest.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kga-allratings-latest
          path: AllRatings_latest.pdf

      # 이 작업은 데이터를 자동으로 고치지 않으므로 커밋·푸시 단계가 없습니다.
      # (2026-11 검증한 데이터를 추정 규칙으로 덮어쓰지 않기 위함)
